services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: energy_supervisor
      POSTGRES_USER: energy
      POSTGRES_PASSWORD: energy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ../iot/mqtt-config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://energy:energy@db:5432/energy_supervisor
      MQTT_BROKER_HOST: broker.hivemq.com
      MQTT_BROKER_PORT: 1883
      MQTT_TOPIC: sensors/data
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      - db
      - mosquitto
    ports:
      - "8000:8000"

volumes:
  pgdata:
